name: Eval CI

on: push

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Embed knowledge base into Chroma
        run: python src/retrieval.py

      - name: Run eval subset (one case per flag type)
        # One per flag type, picked for decisiveness, not just coverage --
        # T0014 (amount_spike) was swapped for T0078 after a real, logged
        # CI flip (escalate -> clear on two consecutive runs, zero code
        # changes) exposed it as a genuinely borderline case: a moderate
        # overage plus a high-risk-merchant tag, with a mitigating prior
        # purchase the model itself surfaced back in Action 13. T0078 is a
        # single-signal case (~2.75x typical max, no complicating factor)
        # per eval_set.json's own reasoning -- chosen to reduce CI flakiness,
        # not yet live-confirmed stable itself.
        #
        # T0116 (geo_anomaly), T0078 (amount_spike), T0018 (velocity_spike),
        # T0055 (new_merchant_category).
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m eval.run_eval --only T0116,T0078,T0018,T0055